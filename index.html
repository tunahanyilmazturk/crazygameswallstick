<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Surların Efendisi — Son Okçu Ayakta</title>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <div id="viewport">
          <canvas
            id="game"
            role="img"
            aria-label="Surların Efendisi oyun alanı"
            aria-describedby="game-description"
          ></canvas>
          <p id="game-description" class="sr-only">
            Kahraman ve birlikler düşmanlarla otomatik savaşır. Savaş alanına tıklayarak ekstra ok atabilir, sürükleyerek veya yön tuşlarıyla kamerayı kaydırabilirsin. Geliştirme ve hız kontrolleri oyun alanının çevresindeki menülerdedir.
          </p>
          <div id="hud"></div>
        </div>
      </div>
      <div id="panel"></div>
      <div id="modal-root"></div>
    </div>
    <script type="module" src="/src/boot.js"></script>
  </body>
</html>
